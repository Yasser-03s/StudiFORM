<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090a0d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="StudyForm">
  <meta name="description" content="Suivi visuel de progression universitaire par modules.">
  <title>StudyForm — Progression universitaire</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #090a0d;
      --surface: #111318;
      --surface-2: #171a21;
      --surface-3: #20242d;
      --line: rgba(255,255,255,.09);
      --text: #f2f3f5;
      --muted: #9da3af;
      --accent: #d9f36a;
      --accent-ink: #171b08;
      --red: #ff5b69;
      --green: #9fe0aa;
      --radius: 22px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--bg); }
    body { margin: 0; min-height: 100vh; min-height: 100dvh; background: var(--bg); }
    button, input { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    button:disabled { opacity: .42; cursor: not-allowed; }
    .ambient { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .ambient::before, .ambient::after { content: ""; position: absolute; width: 320px; height: 320px; border-radius: 50%; filter: blur(100px); opacity: .10; }
    .ambient::before { top: 8%; left: -180px; background: #bfe34d; }
    .ambient::after { top: 42%; right: -220px; background: #686be7; }
    #app { position: relative; z-index: 1; min-height: 100vh; min-height: 100dvh; }
    .app-shell { width: min(100%, 760px); margin: 0 auto; padding: calc(16px + var(--safe-top)) 18px calc(28px + var(--safe-bottom)); }
    .topbar { display:flex; align-items:center; gap:12px; margin-bottom:25px; }
    .brand-mark { width:42px; height:42px; display:grid; place-items:center; border-radius:15px; color:var(--accent-ink); background:var(--accent); font-weight:950; font-size:19px; letter-spacing:-.06em; box-shadow: 0 6px 24px rgba(217,243,106,.12); }
    .brand-copy { min-width:0; flex:1; }
    .eyebrow { margin:0 0 3px; font-size:10px; line-height:1.2; letter-spacing:.18em; color:var(--muted); text-transform:uppercase; font-weight:800; }
    h1 { margin:0; font-size:19px; line-height:1.1; letter-spacing:-.04em; font-weight:800; }
    .top-stat { text-align:right; padding-left:10px; }
    .top-stat strong { display:block; color:var(--accent); font-size:18px; letter-spacing:-.04em; }
    .top-stat span { display:block; margin-top:2px; color:var(--muted); font-size:10px; }
    .intro { margin:0 0 18px; }
    .intro h2 { margin:0 0 7px; max-width:520px; font-size:clamp(27px, 7vw, 38px); line-height:1.04; letter-spacing:-.055em; }
    .intro p { margin:0; max-width:570px; color:var(--muted); font-size:13px; line-height:1.55; }
    .avatar-card { position:relative; margin:18px 0 23px; padding:15px 14px 13px; overflow:hidden; border:1px solid var(--line); border-radius:26px; background:linear-gradient(145deg, rgba(255,255,255,.045), rgba(255,255,255,.012)); }
    .avatar-card::before { content:""; position:absolute; width:230px; height:230px; left:50%; top:28%; transform:translate(-50%,-50%); border-radius:50%; background:rgba(217,243,106,.04); filter:blur(24px); pointer-events:none; }
    .avatar-card-top { position:relative; z-index:1; display:flex; align-items:center; justify-content:space-between; gap:10px; }
    .avatar-card-top .small-label { color:var(--muted); font-size:10px; text-transform:uppercase; letter-spacing:.13em; font-weight:800; }
    .stage-key { display:flex; gap:4px; align-items:center; }
    .stage-key span { width:7px; height:7px; border-radius:50%; background:#373b44; }
    .stage-key span.active { background:var(--accent); box-shadow:0 0 12px rgba(217,243,106,.35); }
    .avatar-wrap { position:relative; z-index:1; display:flex; justify-content:center; align-items:center; padding:4px 0 0; }
    .avatar-art { position:relative; flex:none; height:clamp(370px, 55svh, 465px); width:214px; isolation:isolate; }
    .avatar-base, .part-layer { position:absolute; inset:0; background-repeat:no-repeat; background-size:100% 100%; }
    .avatar-base { z-index:0; }
    .part-layer { z-index:1; pointer-events:none; }
    /* Les six masques sont des polygones normalisés dans le cadre d'une silhouette (340 x 768 px). */
    .part-arm-left { clip-path:polygon(29% 22%, 37% 24%, 33% 31%, 27% 40%, 21% 49%, 16% 55%, 13% 59%, 9% 60%, 6% 57%, 7% 53%, 12% 47%, 17% 38%, 22% 30%); z-index:5; }
    .part-arm-right { clip-path:polygon(71% 22%, 63% 24%, 67% 31%, 73% 40%, 79% 49%, 84% 55%, 87% 59%, 91% 60%, 94% 57%, 93% 53%, 88% 47%, 83% 38%, 78% 30%); z-index:5; }
    .part-chest { clip-path:polygon(31% 22%, 39% 20%, 47% 21%, 53% 21%, 61% 20%, 69% 22%, 78% 27%, 74% 33%, 69% 38%, 63% 42%, 37% 42%, 31% 38%, 26% 33%, 22% 27%); z-index:2; }
    .part-abs { clip-path:polygon(37% 37%, 63% 37%, 67% 43%, 65% 50%, 60% 54%, 54% 56%, 46% 56%, 40% 54%, 35% 50%, 33% 43%); z-index:3; }
    .part-leg-left { clip-path:polygon(34% 49%, 48% 51%, 49% 57%, 47% 64%, 45% 72%, 45% 83%, 43% 92%, 41% 96%, 35% 96%, 33% 92%, 34% 84%, 34% 76%, 31% 66%, 31% 57%); z-index:4; }
    .part-leg-right { clip-path:polygon(66% 49%, 52% 51%, 51% 57%, 53% 64%, 55% 72%, 55% 83%, 57% 92%, 59% 96%, 65% 96%, 67% 92%, 66% 84%, 66% 76%, 69% 66%, 69% 57%); z-index:4; }
    .hit-zone { position:absolute; inset:0; z-index:10; width:100%; height:100%; border:0; padding:0; background:transparent; color:transparent; clip-path:inherit; cursor:pointer; touch-action:manipulation; }
    .hit-zone::after { content:""; position:absolute; inset:0; background:transparent; transition:background .15s ease; }
    .hit-zone:hover::after, .hit-zone:focus-visible::after { background:rgba(217,243,106,.12); }
    .hit-arm-left { clip-path:polygon(29% 22%, 37% 24%, 33% 31%, 27% 40%, 21% 49%, 16% 55%, 13% 59%, 9% 60%, 6% 57%, 7% 53%, 12% 47%, 17% 38%, 22% 30%); z-index:15; }
    .hit-arm-right { clip-path:polygon(71% 22%, 63% 24%, 67% 31%, 73% 40%, 79% 49%, 84% 55%, 87% 59%, 91% 60%, 94% 57%, 93% 53%, 88% 47%, 83% 38%, 78% 30%); z-index:15; }
    .hit-chest { clip-path:polygon(31% 22%, 39% 20%, 47% 21%, 53% 21%, 61% 20%, 69% 22%, 78% 27%, 74% 33%, 69% 38%, 63% 42%, 37% 42%, 31% 38%, 26% 33%, 22% 27%); z-index:13; }
    .hit-abs { clip-path:polygon(37% 37%, 63% 37%, 67% 43%, 65% 50%, 60% 54%, 54% 56%, 46% 56%, 40% 54%, 35% 50%, 33% 43%); z-index:14; }
    .hit-leg-left { clip-path:polygon(34% 49%, 48% 51%, 49% 57%, 47% 64%, 45% 72%, 45% 83%, 43% 92%, 41% 96%, 35% 96%, 33% 92%, 34% 84%, 34% 76%, 31% 66%, 31% 57%); z-index:12; }
    .hit-leg-right { clip-path:polygon(66% 49%, 52% 51%, 51% 57%, 53% 64%, 55% 72%, 55% 83%, 57% 92%, 59% 96%, 65% 96%, 67% 92%, 66% 84%, 66% 76%, 69% 66%, 69% 57%); z-index:12; }
    .avatar-hint { position:relative; z-index:1; margin:1px 0 0; text-align:center; color:var(--muted); font-size:11px; }
    .progress-row { display:flex; align-items:center; justify-content:space-between; gap:10px; margin:0 0 8px; }
    .progress-row span { color:var(--muted); font-size:11px; }
    .progress-row strong { font-size:11px; font-weight:800; }
    .progress-track { height:5px; margin-bottom:23px; overflow:hidden; border-radius:10px; background:#252831; }
    .progress-fill { height:100%; border-radius:inherit; background:var(--accent); transition:width .3s ease; }
    .section-heading { display:flex; justify-content:space-between; align-items:end; gap:12px; margin:0 0 12px; }
    .section-heading h3 { margin:0; font-size:17px; letter-spacing:-.035em; }
    .section-heading span { color:var(--muted); font-size:11px; }
    .module-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px; }
    .module-card { position:relative; display:flex; align-items:center; gap:11px; min-height:81px; padding:13px 12px; border:1px solid var(--line); border-radius:17px; background:rgba(255,255,255,.028); color:var(--text); text-align:left; cursor:pointer; transition:transform .15s ease, border-color .15s ease, background .15s ease; }
    .module-card:active { transform:scale(.985); }
    .module-card:hover { border-color:rgba(217,243,106,.35); background:rgba(255,255,255,.045); }
    .module-symbol { flex:none; display:grid; place-items:center; width:35px; height:35px; border-radius:12px; background:var(--surface-3); color:var(--accent); font-size:13px; font-weight:900; }
    .module-copy { min-width:0; flex:1; }
    .module-name { display:block; margin-bottom:5px; font-size:12px; line-height:1.2; font-weight:750; overflow-wrap:anywhere; }
    .module-stage { display:block; color:var(--muted); font-size:10px; }
    .module-arrow { color:#777e8c; font-size:17px; align-self:flex-start; line-height:1; }
    .notice { margin:0 0 16px; padding:12px 13px; border:1px solid rgba(159,224,170,.22); border-radius:14px; color:var(--green); background:rgba(159,224,170,.07); font-size:12px; line-height:1.5; }
    .back-button { display:inline-flex; align-items:center; gap:8px; margin:0 0 21px; padding:9px 0; border:0; background:transparent; color:var(--muted); cursor:pointer; font-size:12px; font-weight:700; }
    .module-hero { margin-bottom:23px; }
    .module-hero h2 { margin:0 0 10px; max-width:590px; font-size:clamp(30px,8vw,43px); letter-spacing:-.06em; line-height:1.01; overflow-wrap:anywhere; }
    .hero-meta { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
    .pill { display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); border-radius:999px; padding:7px 10px; background:rgba(255,255,255,.04); color:var(--muted); font-size:10px; font-weight:750; }
    .pill.level { color:var(--accent); border-color:rgba(217,243,106,.24); background:rgba(217,243,106,.07); }
    .panel { padding:17px 14px; margin:0 0 14px; border:1px solid var(--line); border-radius:var(--radius); background:rgba(255,255,255,.028); }
    .panel-title-row { display:flex; justify-content:space-between; align-items:start; gap:10px; margin-bottom:8px; }
    .panel-title-row h3 { margin:0; font-size:17px; letter-spacing:-.035em; }
    .panel-title-row p { margin:6px 0 0; color:var(--muted); font-size:11px; line-height:1.45; }
    .count-pill { flex:none; padding:6px 8px; border-radius:999px; background:var(--surface-3); color:var(--muted); font-size:10px; font-weight:800; }
    .task-list { display:grid; gap:8px; margin:14px 0 12px; }
    .task-row { display:flex; align-items:center; gap:9px; padding:9px 8px 9px 11px; border:1px solid rgba(255,255,255,.065); border-radius:13px; background:rgba(0,0,0,.12); }
    .task-check { appearance:none; -webkit-appearance:none; flex:none; display:grid; place-items:center; width:22px; height:22px; margin:0; border:1.5px solid #555b67; border-radius:7px; background:#15171c; cursor:pointer; }
    .task-check:checked { border-color:var(--accent); background:var(--accent); }
    .task-check:checked::after { content:"✓"; color:var(--accent-ink); font-size:15px; line-height:1; font-weight:950; }
    .task-check:disabled { cursor:not-allowed; opacity:.75; }
    .task-text { width:100%; min-width:0; padding:7px 0; border:0; outline:0; background:transparent; color:var(--text); font-size:13px; }
    .task-text::placeholder { color:#68707e; }
    .task-text:disabled { color:#d3d5dc; opacity:.86; }
    .task-text.is-done { color:var(--muted); text-decoration:line-through; }
    .delete-task { display:grid; place-items:center; flex:none; width:30px; height:30px; border:0; border-radius:9px; background:transparent; color:#777e8c; font-size:19px; cursor:pointer; }
    .delete-task:hover { color:var(--red); background:rgba(255,91,105,.08); }
    .add-task { display:flex; justify-content:center; align-items:center; gap:8px; width:100%; min-height:43px; border:1px dashed #3a3f4a; border-radius:12px; background:transparent; color:#c5c9d0; font-size:12px; font-weight:750; cursor:pointer; }
    .add-task:hover { border-color:var(--accent); color:var(--accent); }
    .empty-tasks { padding:21px 9px; text-align:center; color:var(--muted); font-size:12px; line-height:1.55; }
    .timer-panel { padding:18px 15px; border-radius:20px; background:linear-gradient(135deg, rgba(217,243,106,.1), rgba(217,243,106,.025)); border:1px solid rgba(217,243,106,.22); }
    .timer-label { margin:0 0 8px; color:var(--muted); font-size:10px; text-transform:uppercase; letter-spacing:.14em; font-weight:850; }
    .timer-display { margin:0 0 7px; font-size:clamp(40px,12vw,58px); line-height:1; letter-spacing:-.075em; font-weight:850; font-variant-numeric:tabular-nums; }
    .timer-caption { margin:0 0 17px; color:var(--muted); font-size:11px; line-height:1.5; }
    .button-primary, .button-secondary, .button-danger { display:flex; align-items:center; justify-content:center; gap:9px; width:100%; min-height:51px; padding:13px 16px; border:0; border-radius:15px; font-size:13px; font-weight:850; cursor:pointer; transition:transform .15s ease, opacity .15s ease; touch-action:manipulation; }
    .button-primary:active, .button-secondary:active, .button-danger:active { transform:scale(.99); }
    .button-primary { background:var(--accent); color:var(--accent-ink); }
    .button-secondary { margin-top:10px; border:1px solid var(--line); background:rgba(255,255,255,.04); color:var(--text); }
    .button-danger { margin-top:10px; border:1px solid rgba(255,91,105,.20); background:rgba(255,91,105,.08); color:#ff8e98; }
    .form-error { display:none; margin:9px 0 0; color:#ff929b; font-size:11px; line-height:1.45; }
    .form-error.visible { display:block; }
    .session-note { margin:12px 0 0; color:var(--muted); font-size:11px; line-height:1.5; }
    .archive-list { display:grid; gap:10px; margin-top:13px; }
    .archive-item { padding:12px; border:1px solid var(--line); border-radius:13px; background:rgba(0,0,0,.12); }
    .archive-top { display:flex; justify-content:space-between; gap:10px; margin-bottom:5px; }
    .archive-top strong { color:var(--green); font-size:11px; }
    .archive-top time { color:var(--muted); font-size:10px; text-align:right; }
    .archive-tasks { margin:0; padding-left:17px; color:#c0c4cc; font-size:11px; line-height:1.55; }
    .muted-empty { margin:13px 0 0; color:var(--muted); font-size:11px; }
    .footer-note { margin:23px 0 3px; text-align:center; color:#606673; font-size:10px; line-height:1.6; }
    .blank-screen { min-height:100vh; min-height:100dvh; padding:calc(28px + var(--safe-top)) 24px calc(30px + var(--safe-bottom)); display:flex; flex-direction:column; align-items:center; justify-content:center; background:#000; color:#f6f6f7; text-align:center; }
    .blank-mark { display:grid; place-items:center; width:42px; height:42px; margin-bottom:29px; border:1px solid #5c2026; border-radius:50%; color:#ff6b75; font-weight:900; font-size:20px; }
    .blank-kicker { margin:0 0 13px; color:#ff6b75; font-size:10px; font-weight:850; letter-spacing:.22em; text-transform:uppercase; }
    .blank-title { max-width:460px; margin:0; font-size:clamp(27px,8vw,43px); line-height:1.07; letter-spacing:-.055em; font-weight:850; }
    .blank-subtitle { max-width:320px; margin:14px auto 0; color:#77777c; font-size:12px; line-height:1.7; }
    .blank-line { width:54px; height:2px; margin:29px 0 27px; background:#8d2029; }
    .blank-timer { font-size:clamp(57px,18vw,86px); line-height:1; letter-spacing:-.08em; font-weight:300; font-variant-numeric:tabular-nums; }
    .blank-timer-caption { margin:12px 0 0; color:#65656a; font-size:10px; text-transform:uppercase; letter-spacing:.16em; }
    .blank-message { max-width:320px; min-height:40px; margin:22px 0 0; color:#8d8d93; font-size:12px; line-height:1.6; }
    .blank-validate { width:min(100%,340px); margin-top:20px; border:1px solid #f0f0f0; background:#f0f0f0; color:#111; }
    .blank-validate:disabled { display:none; }
    .blank-rule { margin-top:26px; color:#4f4f55; font-size:10px; line-height:1.6; }
    @media (min-width:600px) {
      .app-shell { padding-left:26px; padding-right:26px; }
      .home-layout { display:grid; grid-template-columns: .92fr 1.08fr; gap:18px; align-items:center; }
      .avatar-card { margin-top:0; }
      .module-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
      .module-section { margin-top:25px; }
    }
    @media (max-width:360px) {
      .app-shell { padding-left:13px; padding-right:13px; }
      .avatar-card { padding-left:8px; padding-right:8px; }
      .module-card { padding:11px 9px; gap:8px; }
      .module-symbol { width:31px; height:31px; }
    }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { transition:none !important; scroll-behavior:auto !important; } }
  </style>
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>
  <div id="app" aria-live="polite"></div>
  <script>
    'use strict';

    /*
      APPLICATION AUTONOME : l'image de 4 silhouettes est intégrée dans ce fichier.
      Pour remplacer l'image, remplacez SPRITE_IMAGE_DATA ci-dessous par une URI data:image/png;base64,...
      ou adaptez cette constante en `"image_tnVoXP.png"` et placez ce PNG à côté de index.html.

      DÉCOUPAGE DE L'IMAGE (coordonnées de l'image fournie : 1376 x 768 px) :
      - Les centres approximatifs des stades sont x = 170, 514, 856 et 1202 px.
      - Chaque calque affiche la même image, déplacée horizontalement pour centrer un stade.
      - Les six classes `.part-*` appliquent des clip-path polygonaux normalisés (0 à 100 %) au corps.
      - Pour améliorer les raccords, ajustez les sommets des polygones CSS et, si la planche change,
        corrigez `STAGE_CENTERS`. Un détourage SVG manuel par stade donnerait un résultat plus précis.

    }
    function escapeHTML(value) {
      return String(value).replace(/[&<>"']/g, character => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[character]));
    }
    function getModule(id) { return MODULES.find(module => module.id === id); }
    function getTasks(moduleId) { return state.tasks[moduleId] || []; }
    function allTasksDone(moduleId) {
      const tasks = getTasks(moduleId);
      return tasks.length > 0 && tasks.every(task => task.done && task.text.trim().length > 0);
    }
    function allTasksReady(moduleId) {
      const tasks = getTasks(moduleId);
      return tasks.length > 0 && tasks.every(task => task.text.trim().length > 0);
    }
    function formatTime(milliseconds) {
      const seconds = Math.max(0, Math.ceil(milliseconds / 1000));
      const hours = Math.floor(seconds / 3600);
      const minutes = Math.floor((seconds % 3600) / 60);
      const secs = seconds % 60;
      return [hours, minutes, secs].map(value => String(value).padStart(2, '0')).join(':');
    }
    function formatDate(value) {
      try { return new Intl.DateTimeFormat('fr-FR', { dateStyle: 'medium', timeStyle: 'short' }).format(new Date(value)); }
      catch { return ''; }
    }

    let state = loadState();
    let currentScreen = 'home';
    let currentModuleId = null;
    let notice = '';
    let timerInterval = null;
    let hiddenDuringBlank = false;

    /* Une phase page blanche sauvegardée est toujours annulée au rechargement. */
    if (state.session && state.session.phase === 'blank') {
      rollbackBlankTasks(state.session);
      state.session = null;
      saveState();
    }

    function rollbackBlankTasks(session) {
      const moduleId = session.moduleId;
      const originallyDone = new Set(session.initialDoneIds || []);
      const checkedDuringSession = new Set(session.checkedDuringSessionIds || []);
      getTasks(moduleId).forEach(task => {
        if (checkedDuringSession.has(task.id) || (!originallyDone.has(task.id) && task.done)) task.done = false;
      });
    }

    function topbar(progressCount) {
      return `<header class="topbar">
        <div class="brand-mark" aria-hidden="true">SF</div>
        <div class="brand-copy"><p class="eyebrow">Progression universitaire</p><h1>StudyForm</h1></div>
        <div class="top-stat"><strong>${progressCount}<span style="font-size:11px;color:var(--muted);font-weight:700"> / 18</span></strong><span>paliers franchis</span></div>
      </header>`;
    }

    function avatarMarkup() {
      const layers = MODULES.map(module => `<div class="part-layer ${module.partClass}" data-part="${module.id}" aria-hidden="true"></div>`).join('');
      const hitZones = MODULES.map(module => `<button type="button" class="hit-zone ${module.hitClass}" data-open-module="${module.id}" aria-label="Ouvrir le module ${escapeHTML(module.name)} — Stade ${state.levels[module.id]}"></button>`).join('');
      return `<div class="avatar-card">
        <div class="avatar-card-top"><span class="small-label">Avatar de progression</span><div class="stage-key" aria-label="Quatre stades musculaires">${[1,2,3,4].map(n => `<span class="${n <= Math.max(...Object.values(state.levels)) ? 'active' : ''}"></span>`).join('')}</div></div>
        <div class="avatar-wrap"><div class="avatar-art" id="avatarArt" role="group" aria-label="Zones corporelles cliquables selon le module universitaire">
          <div class="avatar-base" id="avatarBase" aria-hidden="true"></div>${layers}${hitZones}
        </div></div>
        <p class="avatar-hint">Touchez un membre pour ouvrir son module</p>
      </div>`;
    }

    function renderHome() {
      currentScreen = 'home';
      const progressCount = Object.values(state.levels).reduce((sum, level) => sum + level - 1, 0);
      const percent = Math.round(progressCount / 18 * 100);
      const cards = MODULES.map(module => {
        const level = state.levels[module.id];
        const pendingCount = getTasks(module.id).length;
        return `<button type="button" class="module-card" data-open-module="${module.id}">
          <span class="module-symbol" aria-hidden="true">${module.symbol}</span>
          <span class="module-copy"><span class="module-name">${escapeHTML(module.name)}</span><span class="module-stage">Stade ${level} · ${STAGES[level]}${pendingCount ? ` · ${pendingCount} objectif${pendingCount > 1 ? 's' : ''}` : ''}</span></span>
          <span class="module-arrow" aria-hidden="true">›</span>
        </button>`;
      }).join('');
      document.body.classList.remove('blank-mode');
      document.getElementById('app').innerHTML = `<main class="app-shell">
        ${topbar(progressCount)}
        ${notice ? `<div class="notice">${escapeHTML(notice)}</div>` : ''}
        <div class="home-layout">
          <section class="intro"><p class="eyebrow" style="margin-bottom:10px">Un bloc à la fois</p><h2>Construis ta progression, <span style="color:var(--accent)">module par module.</span></h2><p>Chaque zone représente une matière. Termine tes objectifs, respecte la page blanche, puis valide l’effort pour faire évoluer le niveau du membre.</p></section>
          ${avatarMarkup()}
        </div>
        <div class="progress-row"><span>Progression globale</span><strong>${percent}% · ${progressCount}/18</strong></div>
        <div class="progress-track" role="progressbar" aria-label="Progression globale" aria-valuemin="0" aria-valuemax="18" aria-valuenow="${progressCount}"><div class="progress-fill" style="width:${percent}%"></div></div>
        <section class="module-section"><div class="section-heading"><h3>Mes modules</h3><span>6 zones · 4 stades</span></div><div class="module-grid">${cards}</div></section>
        <p class="footer-note">Les niveaux et les objectifs sont sauvegardés sur cet appareil.<br>Un changement de navigateur ou l’effacement des données du site réinitialisera cette sauvegarde.</p>
      </main>`;
      bindCommonButtons();
      refreshAvatar();
      notice = '';
    }

    function renderTasks(moduleId, locked) {
      const tasks = getTasks(moduleId);
      if (!tasks.length) return `<div class="empty-tasks">Aucun objectif pour le moment.<br>Ajoute les exercices ou les pages que tu veux travailler.</div>`;
      return `<div class="task-list">${tasks.map((task, index) => `<div class="task-row" data-task-row="${escapeHTML(task.id)}">
        <input class="task-check" type="checkbox" data-task-check="${escapeHTML(task.id)}" aria-label="Objectif ${index + 1} terminé" ${task.done ? 'checked' : ''} ${locked ? 'disabled' : ''}>
        <input class="task-text ${task.done ? 'is-done' : ''}" type="text" data-task-text="${escapeHTML(task.id)}" value="${escapeHTML(task.text)}" placeholder="Ex. : Exercice 1 TD, lire page 4" aria-label="Description de l’objectif ${index + 1}" maxlength="180" ${locked ? 'disabled' : ''}>
        ${locked ? '' : `<button type="button" class="delete-task" data-delete-task="${escapeHTML(task.id)}" aria-label="Supprimer l’objectif ${index + 1}" title="Supprimer">×</button>`}
      </div>`).join('')}</div>`;
    }

    function renderArchive(moduleId) {
      const archives = state.archives.filter(item => item.moduleId === moduleId).slice(0, 5);
      if (!archives.length) return `<p class="muted-empty">Aucune séance validée pour ce module pour l’instant.</p>`;
      return `<div class="archive-list">${archives.map(item => `<article class="archive-item"><div class="archive-top"><strong>✓ Effort validé · Stade ${item.levelBefore} → ${item.levelAfter}</strong><time>${escapeHTML(formatDate(item.completedAt))}</time></div><ul class="archive-tasks">${(item.tasks || []).map(task => `<li>${escapeHTML(task.text)}</li>`).join('')}</ul></article>`).join('')}</div>`;
    }

    function renderModule(moduleId) {
      currentScreen = 'module';
      currentModuleId = moduleId;
      const module = getModule(moduleId);
      if (!module) { renderHome(); return; }
      const level = state.levels[moduleId];
      const isWorking = Boolean(state.session && state.session.phase === 'work' && state.session.moduleId === moduleId);
      const tasks = getTasks(moduleId);
      const doneCount = tasks.filter(task => task.done).length;
      const tasksReady = allTasksReady(moduleId);
      const timerMarkup = isWorking ? `
        <section class="timer-panel" aria-label="Chronomètre de travail">
          <p class="timer-label">Bloc de travail en cours</p><div class="timer-display" id="workTimer">${formatTime(state.session.workEndsAt - Date.now())}</div>
          <p class="timer-caption">Objectifs terminés : <strong id="doneCount">${doneCount}/${tasks.length}</strong>. Le compte à rebours continue si tu fermes cette page. Si le temps s’écoule avant la validation complète, aucun niveau ne change.</p>
          <button type="button" class="button-danger" id="stopWork">Stopper — Besoin d’une autre séance</button>
        </section>` : `
        <section class="timer-panel" aria-label="Démarrer un bloc de travail">
          <p class="timer-label">Prochain bloc</p><div class="timer-display">01:30:00</div>
          <p class="timer-caption">Le chrono démarre pour 1 h 30. Les cases s’activent à ce moment-là. Lorsque tous les objectifs sont cochés, la phase de page blanche commence immédiatement.</p>
          <button type="button" class="button-primary" id="startWork" ${tasksReady && !isWorking ? '' : 'disabled'}>Démarrer le bloc de travail <span aria-hidden="true">↗</span></button>
          <p class="form-error ${tasks.length && !tasksReady ? 'visible' : ''}" id="tasksError">Complète le texte de chaque objectif avant de démarrer.</p>
          <p class="session-note">Ajoute au moins un objectif. Pendant le chrono, la liste est verrouillée pour éviter de modifier les critères en cours de séance.</p>
        </section>`;
      document.body.classList.remove('blank-mode');
      document.getElementById('app').innerHTML = `<main class="app-shell">
        ${topbar(Object.values(state.levels).reduce((sum, item) => sum + item - 1, 0))}
        <button type="button" class="back-button" id="backHome"><span aria-hidden="true">←</span> Retour à l’accueil</button>
        ${notice ? `<div class="notice">${escapeHTML(notice)}</div>` : ''}
        <section class="module-hero"><p class="eyebrow" style="margin-bottom:10px">${escapeHTML(module.name)}</p><h2>${escapeHTML(module.name)}</h2><div class="hero-meta"><span class="pill level">Stade ${level} · ${STAGES[level]}</span><span class="pill">${tasks.length} objectif${tasks.length > 1 ? 's' : ''}</span>${isWorking ? '<span class="pill" style="color:var(--accent)">● En cours</span>' : ''}</div></section>
        <section class="panel"><div class="panel-title-row"><div><h3>Objectifs de la séance</h3><p>Écris précisément ce que tu veux terminer durant ce bloc.</p></div><span class="count-pill">${doneCount}/${tasks.length}</span></div>
          ${renderTasks(moduleId, isWorking)}
          ${isWorking ? '<p class="session-note">Les objectifs ne peuvent pas être ajoutés, modifiés ou supprimés pendant le bloc.</p>' : `<button type="button" class="add-task" id="addTask"><span aria-hidden="true">＋</span> Ajouter un objectif</button>`}
        </section>
        ${timerMarkup}
        <section class="panel" style="margin-top:18px"><div class="panel-title-row"><div><h3>Historique des réussites</h3><p>Les objectifs validés sont archivés ici.</p></div></div>${renderArchive(moduleId)}</section>
        <p class="footer-note">Stade maximal : 4 · Massif. Une progression n’est enregistrée qu’après la fin des 10 minutes de page blanche et le clic sur « Valider l’effort ».</p>
      </main>`;
      bindCommonButtons();
      bindModuleEvents(moduleId, isWorking);
      startTicker();
      notice = '';
    }

    function renderBlankScreen() {
      currentScreen = 'blank';
      document.body.classList.add('blank-mode');
      const remaining = Math.max(0, state.session.blankEndsAt - Date.now());
      const complete = remaining <= 0;
      document.getElementById('app').innerHTML = `<main class="blank-screen">
        <div class="blank-mark" aria-hidden="true">✳</div>
        <p class="blank-kicker">Phase de validation mentale</p>
        <h1 class="blank-title">ANALYSE PAGE BLANCHE<br>&amp; STYLO ROUGE</h1>
        <p class="blank-subtitle">Pas de cours, pas de téléphone, pas de distraction. Relis mentalement ton travail, repère les erreurs et prépare la correction sur papier.</p>
        <div class="blank-line" aria-hidden="true"></div>
        <div class="blank-timer" id="blankTimer">${formatTime(remaining)}</div>
        <p class="blank-timer-caption">Temps de réflexion restant</p>
        <p class="blank-message" id="blankMessage">Reste sur cette page jusqu’à la fin du compte à rebours. Si tu quittes ou actualises l’application, la séance sera annulée et les cases cochées durant cette séance seront décochées.</p>
        <button type="button" class="button-primary blank-validate" id="validateEffort" ${complete ? '' : 'disabled'}>Valider l’effort <span aria-hidden="true">→</span></button>
        <p class="blank-rule">Le niveau ne progresse pas avant la validation explicite.</p>
      </main>`;
      document.getElementById('validateEffort').addEventListener('click', validateEffort);
      startTicker();
    }

    function bindCommonButtons() {
      document.querySelectorAll('[data-open-module]').forEach(button => {
        button.addEventListener('click', () => {
          const id = button.getAttribute('data-open-module');
          if (!id || !getModule(id)) return;
          if (state.session && state.session.phase === 'work') {
            currentModuleId = state.session.moduleId;
            renderModule(state.session.moduleId);
          } else {
            notice = '';
            renderModule(id);
          }
        });
      });
    }

    function bindModuleEvents(moduleId, isWorking) {
      const backButton = document.getElementById('backHome');
      if (backButton) backButton.addEventListener('click', () => {
        if (state.session && state.session.phase === 'work') {
          notice = 'Le bloc de travail continue en arrière-plan. Reviens à ce module pour suivre le chrono.';
        }
        renderHome();
      });

      const addButton = document.getElementById('addTask');
      if (addButton) addButton.addEventListener('click', () => {
        if (state.session) return;
        state.tasks[moduleId].push({ id: makeId(), text: '', done: false });
        saveState();
        renderModule(moduleId);
        const inputs = document.querySelectorAll('[data-task-text]');
        if (inputs.length) inputs[inputs.length - 1].focus();
      });

      document.querySelectorAll('[data-delete-task]').forEach(button => {
        button.addEventListener('click', () => {
          if (state.session) return;
          const id = button.getAttribute('data-delete-task');
          state.tasks[moduleId] = getTasks(moduleId).filter(task => task.id !== id);
          saveState();
          renderModule(moduleId);
        });
      });

      document.querySelectorAll('[data-task-text]').forEach(input => {
        input.addEventListener('input', () => {
          const id = input.getAttribute('data-task-text');
          const task = getTasks(moduleId).find(item => item.id === id);
          if (!task || state.session) return;
          task.text = input.value;
          saveState();
          const start = document.getElementById('startWork');
          if (start) start.disabled = !allTasksReady(moduleId);
          const error = document.getElementById('tasksError');
          if (error) error.classList.toggle('visible', getTasks(moduleId).length > 0 && !allTasksReady(moduleId));
        });
      });

      document.querySelectorAll('[data-task-check]').forEach(input => {
        input.addEventListener('change', () => {
          if (!state.session || state.session.phase !== 'work' || state.session.moduleId !== moduleId) return;
          const id = input.getAttribute('data-task-check');
          const task = getTasks(moduleId).find(item => item.id === id);
          if (!task) return;
          task.done = input.checked;
          if (input.checked) {
            if (!Array.isArray(state.session.checkedDuringSessionIds)) state.session.checkedDuringSessionIds = [];
            if (!state.session.checkedDuringSessionIds.includes(task.id)) state.session.checkedDuringSessionIds.push(task.id);
          }
          saveState();
          if (allTasksDone(moduleId)) {
            startBlankPhase();
            return;
          }
          const doneCount = getTasks(moduleId).filter(item => item.done).length;
          document.querySelectorAll('.count-pill').forEach(el => { el.textContent = `${doneCount}/${getTasks(moduleId).length}`; });
          const timerCount = document.getElementById('doneCount');
          if (timerCount) timerCount.textContent = `${doneCount}/${getTasks(moduleId).length}`;
          input.closest('.task-row')?.querySelector('.task-text')?.classList.toggle('is-done', task.done);
        });
      });

      const startButton = document.getElementById('startWork');
      if (startButton) startButton.addEventListener('click', () => {
        if (state.session || !allTasksReady(moduleId)) {
          const error = document.getElementById('tasksError');
          if (error) error.classList.add('visible');
          return;
        }
        const taskList = getTasks(moduleId);
        state.session = {
          moduleId,
          phase: 'work',
          workEndsAt: Date.now() + WORK_DURATION_MS,
          initialDoneIds: taskList.filter(task => task.done).map(task => task.id),
          checkedDuringSessionIds: []
        };
        saveState();
        renderModule(moduleId);
      });

      const stopButton = document.getElementById('stopWork');
      if (stopButton) stopButton.addEventListener('click', () => {
        if (!state.session || state.session.phase !== 'work') return;
        state.session = null;
        notice = 'Bloc arrêté. Les objectifs et leurs cases restent enregistrés pour la prochaine séance ; aucun niveau n’a changé.';
        saveState();
        renderModule(moduleId);
      });
    }

    function startBlankPhase() {
      if (!state.session || state.session.phase !== 'work') return;
      const moduleId = state.session.moduleId;
      state.session.phase = 'blank';
      state.session.blankEndsAt = Date.now() + BLANK_DURATION_MS;
      delete state.session.workEndsAt;
      saveState();
      renderBlankScreen();
    }

    function finishWorkBlock() {
      if (!state.session || state.session.phase !== 'work') return;
      const moduleId = state.session.moduleId;
      if (allTasksDone(moduleId)) {
        startBlankPhase();
        return;
      }
      state.session = null;
      notice = 'Temps écoulé. Les objectifs cochés et décochés sont conservés, mais le niveau ne change pas. Tu peux reprendre lors d’une autre séance.';
      saveState();
      renderModule(moduleId);
    }

    function cancelBlankPhase() {
      if (!state.session || state.session.phase !== 'blank') return;
      const interrupted = state.session;
      rollbackBlankTasks(interrupted);
      state.session = null;
      notice = 'Phase de page blanche interrompue : la séance a été annulée et les cases cochées pendant cette séance ont été décochées.';
      currentModuleId = interrupted.moduleId;
      currentScreen = 'module';
      saveState();
    }

    function validateEffort() {
      if (!state.session || state.session.phase !== 'blank') return;
      if (Date.now() < state.session.blankEndsAt) return;
      const moduleId = state.session.moduleId;
      const module = getModule(moduleId);
      const before = state.levels[moduleId];
      const after = Math.min(4, before + 1);
      const completedTasks = getTasks(moduleId).map(task => ({ text: task.text.trim(), done: true }));
      state.archives.unshift({
        id: makeId(), moduleId, moduleName: module.name,
        completedAt: Date.now(), levelBefore: before, levelAfter: after, tasks: completedTasks
      });
      state.levels[moduleId] = after;
      state.tasks[moduleId] = [];
      state.session = null;
      currentModuleId = null;
      notice = after > before
        ? `Effort validé ! ${module.name} passe au Stade ${after} · ${STAGES[after]}. Les objectifs sont archivés.`
        : `Effort validé ! ${module.name} est déjà au stade maximal. Les objectifs sont archivés.`;
      saveState();
      renderHome();
    }

    function startTicker() {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        if (!state.session) { clearInterval(timerInterval); timerInterval = null; return; }
        if (state.session.phase === 'work') {
          const remaining = state.session.workEndsAt - Date.now();
          const timer = document.getElementById('workTimer');
          if (timer) timer.textContent = formatTime(remaining);
          if (remaining <= 0) finishWorkBlock();
        } else if (state.session.phase === 'blank') {
          const remaining = state.session.blankEndsAt - Date.now();
          const timer = document.getElementById('blankTimer');
          if (timer) timer.textContent = formatTime(remaining);
          const button = document.getElementById('validateEffort');
          if (button) button.disabled = remaining > 0;
          const message = document.getElementById('blankMessage');
          if (message && remaining <= 0) message.textContent = 'Les 10 minutes sont écoulées. Tu peux maintenant valider cet effort.';
        }
      }, 250);
    }

    /* Positionnement des quatre silhouettes : le sprite est réduit à la hauteur du cadre. */
    function refreshAvatar() {
      const art = document.getElementById('avatarArt');
      if (!art) return;
      const height = art.clientHeight;
      const width = CROP_W * height / SOURCE_H;
      art.style.width = `${width}px`;
      const scale = height / SOURCE_H;
      const backgroundSize = `${SOURCE_W * scale}px ${height}px`;
      const base = document.getElementById('avatarBase');
      if (base) setSprite(base, 1, backgroundSize, scale);
      MODULES.forEach(module => {
        const layer = art.querySelector(`[data-part="${module.id}"]`);
        if (layer) setSprite(layer, state.levels[module.id], backgroundSize, scale);
      });
      function setSprite(element, stage, size, scaleValue) {
        const center = STAGE_CENTERS[stage - 1] || STAGE_CENTERS[0];
        const shift = -((center - CROP_CENTER) * scaleValue);
        element.style.backgroundImage = `url("${SPRITE_IMAGE_DATA}")`;
        element.style.backgroundSize = size;
        element.style.backgroundPosition = `${shift}px 0px`;
      }
    }

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden' && state.session && state.session.phase === 'blank') {
        hiddenDuringBlank = true;
        cancelBlankPhase();
      } else if (document.visibilityState === 'visible' && hiddenDuringBlank) {
        hiddenDuringBlank = false;
        if (currentScreen !== 'blank') renderModule(currentModuleId || 'signal');
      }
    });
    window.addEventListener('pagehide', () => {
      if (state.session && state.session.phase === 'blank') cancelBlankPhase();
    });
    window.addEventListener('resize', refreshAvatar, { passive: true });

    /* Reprendre automatiquement le bloc de travail, mais jamais la page blanche. */
    if (state.session && state.session.phase === 'work') {
      currentModuleId = state.session.moduleId;
      if (state.session.workEndsAt <= Date.now()) finishWorkBlock();
      else renderModule(state.session.moduleId);
    } else {
      renderHome();
    }
  </script>
</body>
</html>
